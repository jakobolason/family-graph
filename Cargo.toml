[package]
name = "family_graph"
version = "0.2.1"
edition = "2024"
description = "A Rust application to generate family relationship graphs from Excel data."
repository = "https://github.com/jakobolason/family-graph"
license = "MIT OR Apache-2.0"

[dependencies]
calamine = "0.32.0"
dotenv = "0.15.0"
graphviz-rust = "0.9.5"
layout-rs = "0.1.3"
petgraph = "0.8.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

